[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lex6"
version = "0.1.0"
description = "Agentic RAG system for climate-law documents (PDF, DOCX, TXT) built on local Ollama models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "langchain-core>=0.3",
  "langchain-community>=0.3",
  "langchain-text-splitters>=0.3",
  "langchain-ollama>=0.2",
  "ollama>=0.4",
  "pymupdf>=1.24",
  "docx2txt>=0.8",
  "python-docx>=1.1",
  "sentence-transformers>=3.0",
  "faiss-cpu>=1.8",
  "rank-bm25>=0.2.2",
  "langdetect>=1.0.9",
  "pycountry>=24.6",
  "numpy>=1.26",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
lex6 = "lex6.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lex6 = ["api/static/*", "eval/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: needs a running Ollama server and downloaded HF models (deselected by default in CI)"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
